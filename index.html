<!DOCTYPE html>
<html>
<head>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Lab Scheduler</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<style>
body{font-family:Segoe UI;margin:0}
.header{background:#0078D4;color:white;padding:12px}
.container{padding:10px}
.card{padding:15px;border:1px solid #ddd;margin:10px;border-radius:8px}
@media(max-width:768px){.card{margin:5px}}
</style>
</head>
<body>
<div class='header'>Lab Scheduler Dashboard</div>
<div class='container'>
<div class='card'>Analytics + Admin + Equipment Ready</div>
<div id='calendar'></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
 var calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
   initialView: 'timeGridDay',
   editable:true,
   events:'/api/bookings'
 });
 calendar.render();
});
</script>
</body>
</html>
